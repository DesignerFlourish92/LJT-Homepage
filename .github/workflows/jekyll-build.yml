name: Jekyll build

on:
  # Allow manual runs
  workflow_dispatch:

  # Build on pushes to the default branch
  push:
    branches: [master]

  # Run after bad-pr check
  workflow_run:
    workflows: ["Cleanup bad PR"]
    branches: [master]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: jekyll-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Verify generated content
        run: |
          set -e
          for page in _site/index.html _site/publications/index.html _site/cv/index.html; do
            test -f "$page"
          done

          # Every publication is listed on the home page, the publications page and the CV
          for title in \
            "SynLogic" \
            "Perception Bottleneck" \
            "Universal Truthfulness Hyperplane" \
            "In-Context Sharpness as Alerts" \
            "C-Eval" \
            "Composing Parameter-Efficient Modules" \
            "Vicent0205" \
            "junteng88716710"; do
            grep -q "$title" _site/index.html
            grep -q "$title" _site/publications/index.html
            grep -q "$title" _site/cv/index.html
          done

          # Background, experience and contact details
          grep -q "Junteng Liu" _site/index.html
          grep -q "jliugi@connect.ust.hk" _site/index.html
          grep -q "Hong Kong University of Science and Technology" _site/index.html
          grep -q "Shanghai Jiao Tong University" _site/index.html
          grep -q "Junxian He" _site/index.html
          grep -q "MINIMAX" _site/index.html
          grep -q "Tencent WXG" _site/index.html
          grep -q "Shanghai AI Lab" _site/index.html
          grep -q "Zhiyuan Honor Scholarship" _site/index.html

          # No template placeholder or demo content is published
          ! grep -rq "Your Name" _site
          ! grep -rq "GitHub University" _site
          ! test -e _site/markdown_generator
          ! test -e _site/talkmap
          ! test -e _site/files/paper1.pdf
