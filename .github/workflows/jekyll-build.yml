name: Jekyll build

on:
  # Allow manual runs
  workflow_dispatch:

  # Build on pushes to the default branch
  push:
    branches: [master]

  # Run after bad-pr check
  workflow_run:
    workflows: ["Cleanup bad PR"]
    branches: [master]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: jekyll-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Verify generated content
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          test -f _site/cv/index.html
          grep -q "Junteng Liu" _site/index.html
          grep -q "jliugi@connect.ust.hk" _site/index.html
          grep -q "SynLogic" _site/index.html
          grep -q "Zhiyuan Honor Scholarship" _site/index.html
          grep -q "MINIMAX" _site/cv/index.html
          grep -q "NeurIPS 2023" _site/publications/index.html
          ! grep -rq "Your Name" _site
          ! grep -rq "GitHub University" _site
